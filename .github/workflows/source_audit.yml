name: Windows source, installer and ZIP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan shipped source for personal media, secrets and syntax errors
        shell: pwsh
        run: python tools/audit_repo.py
      - name: Compile all published Python modules
        shell: pwsh
        run: python -m compileall -q app "Voice Engine" tools research tests
      - name: 'Regression: public installation works without private groove23 weights'
        shell: pwsh
        run: python -X utf8 tests/test_optional_groove.py
      - name: Check production JavaScript syntax
        shell: pwsh
        run: node --check app/ui/studio42.js
      - name: Validate Windows PowerShell installer syntax
        shell: powershell
        run: |
          $errorsTotal=0
          foreach($item in Get-ChildItem scripts -Filter '*.ps1' -File){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($item.FullName,[ref]$tokens,[ref]$errors)
            Write-Host "$($item.Name): $(@($errors).Count) parse errors"
            $errorsTotal+=@($errors).Count
          }
          if($errorsTotal){throw "Windows PowerShell syntax errors: $errorsTotal"}
      - name: Resolve voice dependencies from PyPI and official PyTorch CUDA 12.1 on clean Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:UV_NO_PROGRESS = '1'
          $venv = Join-Path $env:RUNNER_TEMP 'hapych-voice-index-qa'
          uv venv --python 3.11 $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --dry-run --only-binary webrtcvad --python (Join-Path $venv 'Scripts\python.exe') --default-index https://pypi.org/simple --torch-backend cu121 -r requirements/voice-engine-win-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build and test the *actual* Windows wheels, without downloading 5 GiB of torch.
          uv pip install --python (Join-Path $venv 'Scripts\python.exe') --default-index https://pypi.org/simple --no-deps --only-binary :all: 'webrtcvad-wheels==2.0.14.post1' 'resemblyzer==0.1.4'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $venv 'Scripts\python.exe') -X utf8 -c "import importlib.metadata as m, webrtcvad; assert m.version('resemblyzer') == '0.1.4'; assert m.version('webrtcvad-wheels') == '2.0.14.post1'; assert webrtcvad.Vad(1).is_speech(bytes(320),16000) == False; print('Prebuilt Windows WebRTC VAD and Resemblyzer wheels OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/test_voice_win_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ZIP, check CRC, extract and verify SHA-256 of all files
        shell: pwsh
        run: python tools/build_source_archive.py --output "$env:RUNNER_TEMP\HAPYCH-MusicStudio-Source.zip" --verify
      - name: Read-only Bootstrap / Install preflight
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Bootstrap-Windows.ps1 -ValidateOnly
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Install-Windows.ps1 -ValidateOnly
          exit $LASTEXITCODE
      - name: 'Regression: restore --no-checkout upstream checkout'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Installer-Recovery.ps1
      - name: 'Regression: ZIP installer reuses an existing Git installation without overwriting songs'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Bootstrap-Existing-Git.ps1
      - name: 'Regression: web server stays available while ACE-Step initializes'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Server-And-Engine-State.ps1
      - name: 'Regression: ApexSVC patch clean, existing, partial, CRLF and conflicts'
        shell: pwsh
        run: python -X utf8 tests/test_apex_patch.py
      - name: 'Regression: Windows PATH refresh stays stable on repeated bootstrap'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Bootstrap-Path.ps1
      - name: 'Regression: Seed-VC overlays install, update, back up and protect user edits'
        shell: pwsh
        run: python -X utf8 tests/test_seed_overlays.py
      - name: 'Regression: safe shutdown respects owned PID, active job and other applications'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Safe-Service-Shutdown.ps1
      - name: 'Regression: live dummy Windows Studio and ACE-Step listeners can be safely closed'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\EndToEnd-Studio-Shutdown.ps1
      - name: Upload source-only ZIP from passing checks
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HAPYCH-MusicStudio-source-verified
          path: ${{ runner.temp }}\HAPYCH-MusicStudio-Source.zip
          if-no-files-found: error
          retention-days: 14
